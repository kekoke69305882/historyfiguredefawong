<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测测你的灵魂对应哪位中国历史人物</title>
<style>
:root{
  --paper:#f6f1e6; --ink:#2e2a26; --red:#a23e32; --gold:#b98a3e;
  --mist:#8c8477; --card:#fffdf7;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Songti SC","Noto Serif SC","STSong",serif;
  background:var(--paper); color:var(--ink); min-height:100vh;
  background-image:radial-gradient(circle at 15% 10%,rgba(185,138,62,.08) 0,transparent 40%),
                   radial-gradient(circle at 85% 90%,rgba(162,62,50,.07) 0,transparent 40%);
}
.wrap{max-width:560px;margin:0 auto;padding:24px 20px 60px;}
.page{display:none;animation:fadeUp .5s ease both;}
.page.show{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

.home-title{margin-top:6vh;text-align:center;}
.seal{
  width:78px;height:78px;margin:0 auto 22px;border:3px solid var(--red);color:var(--red);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:bold;letter-spacing:2px;transform:rotate(-6deg);
  background:rgba(162,62,50,.06);
}
h1{font-size:27px;line-height:1.55;letter-spacing:2px;}
h1 em{font-style:normal;color:var(--red);border-bottom:2px solid var(--gold);padding-bottom:2px;}
.home-sub{margin-top:18px;color:var(--mist);font-size:14px;line-height:2;text-align:center;}
.btn{
  display:block;width:100%;margin:36px auto 0;padding:15px;border:none;cursor:pointer;
  font-family:inherit;font-size:17px;letter-spacing:6px;border-radius:6px;
  background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(162,62,50,.28);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(162,62,50,.35);}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid var(--red);box-shadow:none;letter-spacing:3px;font-size:14px;width:auto;padding:10px 22px;margin:16px auto 0;}
.note{margin-top:26px;font-size:12px;color:var(--mist);text-align:center;}

.bar-outer{position:sticky;top:0;z-index:9;padding-top:14px;background:linear-gradient(var(--paper) 70%,transparent);}
.bar{height:6px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden;}
.bar-in{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:3px;transition:width .4s ease;}
.bar-text{font-size:12px;color:var(--mist);margin:8px 2px 0;}
.qcard{background:var(--card);border:1px solid rgba(185,138,62,.25);border-radius:14px;
  padding:28px 22px 22px;margin-top:18px;box-shadow:0 8px 24px rgba(60,45,20,.07);}
.qnum{color:var(--gold);font-size:13px;letter-spacing:3px;}
.qtext{font-size:19px;line-height:1.7;margin:12px 0 20px;letter-spacing:1px;}
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1.5px solid rgba(140,132,119,.3);
  border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer;font-family:inherit;
  font-size:15px;line-height:1.6;color:var(--ink);transition:all .18s;
}
.opt:hover{border-color:var(--red);background:rgba(162,62,50,.05);transform:translateX(4px);}
.opt.sel{border-color:var(--red);background:rgba(162,62,50,.08);}
.opt.sel .tag{background:var(--red);color:#fff;border-color:var(--red);}
.opt .tag{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;
  border:1px solid var(--gold);color:var(--gold);border-radius:50%;font-size:12px;margin-right:10px;transition:all .18s;}
.nav-row{display:flex;justify-content:space-between;margin-top:6px;}
.mini{background:none;border:none;color:var(--mist);font-family:inherit;font-size:13px;cursor:pointer;padding:8px;}
.mini:disabled{opacity:.3;cursor:default;}

.result-card{
  background:linear-gradient(160deg,#fffdf7 0%,#f9f2e0 100%);
  border:2px solid var(--gold);border-radius:18px;padding:34px 26px;
  box-shadow:0 14px 40px rgba(120,80,20,.15);position:relative;overflow:hidden;
}
.result-card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(185,138,62,.4);border-radius:12px;pointer-events:none;}
.r-label{text-align:center;color:var(--gold);font-size:13px;letter-spacing:5px;}
.r-name{text-align:center;font-size:44px;letter-spacing:8px;color:var(--red);margin:14px 0 4px;font-weight:bold;}
.r-role{text-align:center;color:var(--ink);font-size:15px;letter-spacing:3px;}
.r-line{margin:22px auto 8px;text-align:center;font-size:16px;color:#5a4a2f;line-height:1.9;
  border-top:1px dashed rgba(185,138,62,.5);border-bottom:1px dashed rgba(185,138,62,.5);padding:16px 8px;}
.r-sub{text-align:center;color:var(--mist);font-size:13px;margin-top:12px;}
.r-sub b{color:var(--gold);}
.sec{margin-top:20px;}
.sec h3{font-size:14px;letter-spacing:4px;color:var(--red);margin-bottom:8px;}
.sec h3::before{content:"◆ ";color:var(--gold);font-size:10px;vertical-align:2px;}
.sec p{font-size:14px;line-height:1.9;color:#4a453e;}
.badges{display:flex;flex-wrap:wrap;gap:8px;}
.badge{background:rgba(185,138,62,.12);border:1px solid rgba(185,138,62,.45);color:#7a5c22;
  font-size:13px;padding:5px 12px;border-radius:20px;letter-spacing:1px;}
.share-tip{text-align:center;color:var(--mist);font-size:12px;margin-top:26px;line-height:1.9;}
@media (min-width:700px){ .wrap{max-width:640px;} h1{font-size:32px;} .qtext{font-size:21px;} }
</style>
</head>
<body>
<div class="wrap">

  <section id="home" class="page show">
    <div class="home-title">
      <div class="seal">魂</div>
      <h1>测测你的灵魂<br>对应哪位<em>中国历史人物</em></h1>
      <p class="home-sub">40 道生活化小题 · 10 位历史人物<br>谋士 / 帝王 / 女帝 / 文人 / 侠客 / 诗人 / 将领 / 隐士 / 才女 / 女将<br>看你骨子里藏着谁的影子</p>
      <button class="btn" onclick="startQuiz()">开 始 测 试</button>
      <p class="note">本测试为趣味人格测试，非历史考试，亦非专业心理诊断</p>
    </div>
  </section>

  <section id="quiz" class="page">
    <div class="bar-outer">
      <div class="bar"><div class="bar-in" id="barIn"></div></div>
      <div class="bar-text" id="barText">0 / 40</div>
    </div>
    <div class="qcard">

      <div class="qtext" id="qtext"></div>
      <div id="opts"></div>
      <div class="nav-row">
        <button class="mini" id="prevBtn" onclick="prevQ()">← 上一题</button>
        <span></span>
      </div>
    </div>
  </section>

  <section id="result" class="page">
    <div class="result-card" id="rcard"></div>
    <p class="share-tip">📱 长按 / 截屏保存结果卡，分享到小红书 & 朋友圈<br>考考你的朋友，看看谁是"谪仙"谁是"女帝"</p>
    <button class="btn ghost" onclick="location.reload()">↺ 再测一次</button>
  </section>

</div>

<script>
/* ================= 人物档案（10 位） ================= */

/* ================= 逻辑 ================= */
let cur=0;
let answers=new Array(QS.length).fill(null);

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
  const el=document.getElementById(id);
  void el.offsetWidth;
  el.classList.add("show");
  window.scrollTo(0,0);
}

function startQuiz(){
  cur=0;
  answers=new Array(QS.length).fill(null);
  show("quiz"); renderQ();
}
function renderQ(){
  const q=QS[cur];
  document.getElementById("qnum").textContent=`第 ${cur+1} 题 · 共 ${QS.length} 题`;
  document.getElementById("qtext").textContent=q[0];
  const box=document.getElementById("opts"); box.innerHTML="";
  q[1].forEach((o,i)=>{
    const [txt,key]=o.split("|");
    const b=document.createElement("button");
    b.className="opt"+(answers[cur]===key?" sel":"");
    b.innerHTML=`<span class="tag">${"ABCD"[i]}</span>${txt}`;
    b.onclick=()=>answer(key);
    box.appendChild(b);
  });
  document.getElementById("prevBtn").disabled=cur===0;
  document.getElementById("barIn").style.width=Math.round(cur/QS.length*100)+"%";
  document.getElementById("barText").textContent=`${cur} / ${QS.length}`;
}
function answer(key){
  answers[cur]=key;
  cur++;
  if(cur>=QS.length){finish();}else{renderQ();}
}
function prevQ(){
  if(cur===0)return;
  cur--; renderQ();
}
function finish(){
  // 归一化计分：得分 ÷ 该类型选项出现总次数（10 类各 16 槽，分布完全均衡）
  const appear={}; KEYS.forEach(k=>appear[k]=0);
  QS.forEach(q=>q[1].forEach(o=>{appear[o.split("|")[1]]++;}));
  const score={};
  KEYS.forEach(k=>score[k]=0);
  answers.forEach(k=>{if(k)score[k]++;});
  const ranked=KEYS.map(k=>({k,r:score[k]/Math.max(appear[k],1)}))
                   .sort((a,b)=>b.r-a.r);
  showResult(ranked[0].k, ranked[1].k);
}
function showResult(main,sub){
  const t=TYPES[main], s=TYPES[sub];
  document.getElementById("rcard").innerHTML=`
    <div class="r-label">— 你的灵魂是 —</div>
    <div class="r-name">${t.name}</div>
    <div class="r-role">${t.role}</div>
    <div class="r-line">「${t.line}」</div>
    <div class="r-sub">隐藏副人格：<b>${s.name}</b>（${s.role}）</div>
    <div class="sec"><h3>性格特点</h3><div class="badges">${t.traits.map(x=>`<span class="badge">${x}</span>`).join("")}</div></div>
    <div class="sec"><h3>匹配理由</h3><p>${t.reason}</p></div>
    <div class="sec"><h3>隐藏优势</h3><p>${t.hidden}</p></div>
    <div class="sec"><h3>趣味彩蛋</h3><p>${t.egg}</p></div>
    <div class="sec"><h3>你的关键词</h3><div class="badges">${t.badge.map(x=>`<span class="badge">#${x}</span>`).join("")}</div></div>
    <p class="share-tip" style="margin-top:22px">✨ 截屏这张卡片，去考考你的朋友吧 ✨</p>`;
  show("result");
}
/* 键盘快捷键：1-4 选择，← 上一题 */
document.addEventListener("keydown",e=>{
  if(document.getElementById("quiz").classList.contains("show")){
    if(["1","2","3","4"].includes(e.key)){const i=+e.key-1;if(i<QS[cur][1].length)answer(QS[cur][1][i].split("|")[1]);}
    if(e.key==="ArrowLeft")prevQ();
  }
});
